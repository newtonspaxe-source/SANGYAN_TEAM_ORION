<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARAKH AI - Cyber Protection Engine</title>
  
  <!-- Premium Fonts: Cinzel Decorative, Yatra One, Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Space+Grotesk:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: '#0F172A',
            goldAccent: '#C5A059',
            goldGlow: '#DFB56C',
            crimsonVivid: '#DC2626',
            crimsonMuted: '#991B1B',
            champagneBg: '#FAF4E8',
            warmPaper: '#F4EAD5',
          },
          fontFamily: {
            stylishHindi: ['"Yatra One"', 'serif'],
            display: ['"Cinzel Decorative"', 'serif'],
            tech: ['"Space Grotesk"', 'sans-serif'],
          },
          letterSpacing: {
            architectural: '0.35em',
            dense: '-0.02em',
          }
        }
      }
    }
  </script>

  <style>
    /* Ambient Glow Pulse */
    @keyframes ambientPulse {
      0%, 100% { opacity: 0.45; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.65; transform: scale(1.08) translate(-2%, 2%); }
    }
    
    .glow-sphere {
      animation: ambientPulse 10s ease-in-out infinite;
    }

    /* Keyframe Animations for Smooth Transitions */
    @keyframes smoothFadeIn {
      0% { opacity: 0; filter: blur(8px); transform: translateY(12px); }
      100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
    }

    @keyframes softBgRecess {
      0% { filter: blur(0px); opacity: 1; }
      100% { filter: blur(4px); opacity: 0.22; }
    }

    @keyframes centerGlassExpand {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); filter: blur(16px); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px); }
    }

    /* Entry Animations */
    .anim-entry-1 { animation: smoothFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-entry-2 { animation: smoothFadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.25s; }
    .anim-entry-3 { animation: smoothFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s; }

    .anim-soft-recess { animation: softBgRecess 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-badge-reveal { animation: centerGlassExpand 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Frosted Glass Shadow */
    .glass-card-shadow {
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12), 0 0 45px rgba(197, 160, 89, 0.25);
    }
  </style>
</head>
<body class="h-full m-0 p-0 antialiased select-none bg-champagneBg text-midnight overflow-hidden font-tech">

  <!-- Main Viewport Canvas -->
  <div id="canvas-container" class="relative min-h-screen w-full flex flex-col justify-between p-6 sm:p-10 lg:p-16 box-border bg-[radial-gradient(ellipse_at_30%_20%,#FFFDF7_0%,#F6EAD4_60%,#EBD8B8_100%)]">
    
    <!-- IICPC-STYLE CYBER RADAR & NETWORK CANVAS -->
    <canvas id="security-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0 opacity-40"></canvas>

    <!-- Fine Paper Grain Overlay -->
    <div class="absolute inset-0 opacity-[0.035] pointer-events-none bg-[radial-gradient(#0F172A_1px,transparent_1px)] [background-size:24px_24px] z-10"></div>

    <!-- Warm Champagne Glow Orb -->
    <div class="glow-sphere absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[380px] sm:w-[550px] h-[380px] sm:h-[550px] bg-[radial-gradient(circle,#FFE29A_0%,rgba(255,255,255,0)_70%)] filter blur-[60px] pointer-events-none z-10"></div>

    <!-- Header Frame -->
    <header class="w-full max-w-6xl mx-auto flex justify-between items-center border-b border-midnight/10 pb-4 text-[10px] sm:text-[11px] font-bold tracking-[0.2em] text-midnight/50 uppercase z-30">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-goldAccent animate-pulse"></span>
        <span>PARAKH AI // THREAT DETECTION SYSTEM</span>
      </div>
      
      <!-- Interactive Replay Sequence Button -->
      <button id="replay-btn" onclick="runLaunchSequence()" class="flex items-center space-x-2 bg-midnight/5 hover:bg-midnight/10 border border-midnight/15 px-4 py-1.5 rounded-full transition-all duration-300 text-midnight text-[10px] tracking-widest uppercase cursor-pointer backdrop-blur-md active:scale-95 shadow-sm hover:border-midnight/30">
        <svg class="w-3.5 h-3.5 transition-transform duration-500 hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Replay Sequence</span>
      </button>
    </header>

    <!-- Core Interactive Stage -->
    <main class="relative w-full max-w-5xl mx-auto my-auto h-[450px] sm:h-[500px] flex flex-col items-center justify-center z-20">
      
      <!-- HEADLINE CONTAINER (Fixed Layout To Prevent Text Shift) -->
      <div id="headline-wrapper" class="w-full flex flex-col items-center justify-center transition-all duration-700">
        
        <!-- Line 1: Devanagari -->
        <div id="line-1" class="w-full text-left max-w-3xl mr-auto pl-2 sm:pl-8 opacity-0">
          <div class="inline-block relative">
            <h1 class="font-stylishHindi text-3xl sm:text-5xl lg:text-6xl text-midnight tracking-wide leading-tight">
              नुकसान से बचो,
            </h1>
            <div class="h-[2px] w-24 bg-gradient-to-r from-goldAccent to-transparent mt-1"></div>
          </div>
        </div>

        <!-- Line 2: Interlocking Scam/Scan Text -->
        <div id="line-2" class="w-full text-right max-w-3xl ml-auto pr-2 sm:pr-8 -mt-2 sm:-mt-4 opacity-0">
          <h2 class="font-stylishHindi text-4xl sm:text-6xl lg:text-7xl leading-tight">
            <span class="text-midnight">हर </span>
            <span class="text-crimsonVivid drop-shadow-[0_2px_12px_rgba(220,38,38,0.15)] inline-block mx-1 font-tech font-black tracking-tight">Scam</span>
            <span class="text-midnight"> को </span>
            <span class="bg-gradient-to-r from-goldAccent to-midnight bg-clip-text text-transparent font-tech font-black">Scan करो!</span>
          </h2>
        </div>

      </div>

      <!-- CENTER GLASSY CARD WITH LOGO BADGE (Reveals over center) -->
      <div id="center-logo-badge" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 z-40 pointer-events-none w-[90%] max-w-lg">
        <div class="flex flex-col items-center justify-center">
          
          <!-- Frosted Glass Card Container -->
          <div class="glass-card-shadow bg-white/75 border-2 border-goldAccent/50 p-6 sm:p-8 rounded-3xl backdrop-blur-xl flex flex-col items-center justify-center shadow-2xl relative overflow-hidden group w-full">
            
            <!-- Light Beam Shimmer -->
            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-goldGlow/25 to-transparent translate-x-[-150%] group-hover:translate-x-[150%] transition-transform duration-1000"></div>

            <!-- Shield Icon Mark -->
            <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-midnight border border-goldAccent/40 flex items-center justify-center shadow-xl mb-4 relative">
              <svg class="w-9 h-9 sm:w-11 sm:h-11 text-champagneBg drop-shadow-[0_0_8px_rgba(223,181,108,0.5)]" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L4 5V11C4 16.52 7.41 21.6 12 23C16.59 21.6 20 16.52 20 11V5L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
                <path d="M9 7H14.5C16.433 7 18 8.567 18 10.5C18 12.433 16.433 14 14.5 14H9V7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9 14V18.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="14.5" cy="10.5" r="1.5" fill="currentColor"/>
              </svg>
            </div>

            <!-- Brand Monogram Text -->
            <div class="flex items-center space-x-3 mb-2">
              <span class="font-display font-black text-2xl sm:text-3xl tracking-[0.2em] text-midnight">
                PARAKH
              </span>
              <div class="bg-midnight px-3 py-1 rounded-lg border border-goldAccent/50 shadow-md">
                <span class="font-tech font-black text-sm sm:text-base text-champagneBg tracking-wider">
                  AI
                </span>
              </div>
            </div>

            <!-- Subtitle Descriptor -->
            <p class="text-[9px] sm:text-[11px] font-bold text-midnight/70 tracking-[0.2em] uppercase font-tech mt-1 text-center border-t border-midnight/10 pt-3 w-full">
              INTELLIGENT INVESTOR PROTECTION
            </p>

          </div>

        </div>
      </div>

      <!-- BOTTOM ACTION CALL -->
      <div id="bottom-action-group" class="w-full text-center mt-8 sm:mt-12 transition-all duration-700">
        <div id="tagline" class="inline-flex items-center justify-center space-x-3 sm:space-x-4 bg-midnight/[0.04] backdrop-blur-md px-6 py-3 rounded-full border border-midnight/10 shadow-sm opacity-0">
          <span class="font-display font-bold text-xs sm:text-sm lg:text-base text-crimsonMuted tracking-architectural uppercase">
            PAUSE
          </span>
          <span class="text-goldAccent/80 text-xs">◆</span>
          <span class="font-display font-bold text-xs sm:text-sm lg:text-base text-midnight tracking-architectural uppercase">
            VERIFY
          </span>
          <span class="text-goldAccent/80 text-xs">◆</span>
          <span class="font-display font-bold text-xs sm:text-sm lg:text-base text-midnight tracking-architectural uppercase">
            THEN TRADE
          </span>
        </div>
      </div>

    </main>

    <!-- Footer Frame -->
    <footer class="w-full max-w-6xl mx-auto border-t border-midnight/10 pt-5 flex flex-col sm:flex-row justify-between items-center space-y-3 sm:space-y-0 z-30">
      
      <!-- Monogram Brand Identifier -->
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-midnight flex items-center justify-center text-champagneBg font-display font-black text-xs shadow-md border border-goldAccent/30">
          P
        </div>
        <div class="flex flex-col text-left">
          <span class="font-display font-black text-sm tracking-widest text-midnight">
            PARAKH <span class="text-crimsonMuted font-tech font-bold">AI</span>
          </span>
          <span class="text-[9px] font-semibold text-midnight/50 tracking-wider uppercase">
            Protection Infrastructure
          </span>
        </div>
      </div>

      <!-- Shield Badge -->
      <div class="text-[9px] sm:text-[10px] font-bold tracking-widest text-midnight/70 bg-goldAccent/15 px-3.5 py-1.5 rounded-full border border-goldAccent/30 flex items-center space-x-2">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-crimsonVivid opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-crimsonVivid"></span>
        </span>
        <span>SCANNER ONLINE // VERIFIED</span>
      </div>

    </footer>

  </div>

  <!-- CYBER NETWORK & RADAR CANVAS SCRIPT (Inspired by ICPC / Tech Challenge Portals) -->
  <script>
    const canvas = document.getElementById('security-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Network Node Graph Elements
    const nodes = [];
    const numNodes = 28;

    for (let i = 0; i < numNodes; i++) {
      nodes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 1.5,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
      });
    }

    let radarAngle = 0;

    function drawSecurityCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxRadius = Math.min(canvas.width, canvas.height) * 0.4;

      // 1. Draw Concentric Radar Rings
      ctx.strokeStyle = 'rgba(197, 160, 89, 0.15)';
      ctx.lineWidth = 1;
      for (let r = maxRadius * 0.3; r <= maxRadius; r += maxRadius * 0.35) {
        ctx.beginPath();
        ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 2. Rotating Radar Scanner Sweep
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, maxRadius, radarAngle, radarAngle + 0.35);
      ctx.closePath();
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
      gradient.addColorStop(0, 'rgba(197, 160, 89, 0.25)');
      gradient.addColorStop(1, 'rgba(197, 160, 89, 0)');
      ctx.fillStyle = gradient;
      ctx.fill();

      // 3. Draw Network Mesh Connections
      for (let i = 0; i < nodes.length; i++) {
        const nodeA = nodes[i];
        nodeA.x += nodeA.vx;
        nodeA.y += nodeA.vy;

        if (nodeA.x < 0 || nodeA.x > canvas.width) nodeA.vx *= -1;
        if (nodeA.y < 0 || nodeA.y > canvas.height) nodeA.vy *= -1;

        // Node points
        ctx.beginPath();
        ctx.arc(nodeA.x, nodeA.y, nodeA.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
        ctx.fill();

        // Connect nearby nodes
        for (let j = i + 1; j < nodes.length; j++) {
          const nodeB = nodes[j];
          const dist = Math.hypot(nodeA.x - nodeB.x, nodeA.y - nodeB.y);
          if (dist < 140) {
            ctx.beginPath();
            ctx.moveTo(nodeA.x, nodeA.y);
            ctx.lineTo(nodeB.x, nodeB.y);
            ctx.strokeStyle = `rgba(197, 160, 89, ${0.2 * (1 - dist / 140)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }

      radarAngle += 0.015;
      requestAnimationFrame(drawSecurityCanvas);
    }

    drawSecurityCanvas();

    // Sequence Control Timers
    const line1 = document.getElementById('line-1');
    const line2 = document.getElementById('line-2');
    const tagline = document.getElementById('tagline');
    const headlineWrapper = document.getElementById('headline-wrapper');
    const bottomActionGroup = document.getElementById('bottom-action-group');
    const centerLogo = document.getElementById('center-logo-badge');
    const container = document.getElementById('canvas-container');

    let recessTimer, revealTimer;

    function runLaunchSequence() {
      clearTimeout(recessTimer);
      clearTimeout(revealTimer);

      // Reset
      line1.className = 'w-full text-left max-w-3xl mr-auto pl-2 sm:pl-8 opacity-0';
      line2.className = 'w-full text-right max-w-3xl ml-auto pr-2 sm:pr-8 -mt-2 sm:-mt-4 opacity-0';
      tagline.className = 'inline-flex items-center justify-center space-x-3 sm:space-x-4 bg-midnight/[0.04] backdrop-blur-md px-6 py-3 rounded-full border border-midnight/10 shadow-sm opacity-0';
      
      headlineWrapper.className = 'w-full flex flex-col items-center justify-center transition-all duration-700';
      bottomActionGroup.className = 'w-full text-center mt-8 sm:mt-12 transition-all duration-700';
      centerLogo.className = 'absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 z-40 pointer-events-none w-[90%] max-w-lg';

      void container.offsetWidth;

      // Phase 1: Sequential Text Entry
      line1.classList.add('anim-entry-1');
      line2.classList.add('anim-entry-2');
      tagline.classList.add('anim-entry-3');

      const READING_TIME_PAUSE = 3500; 
      const BADGE_REVEAL_DELAY = 300;   

      // Phase 2: Recess Background
      recessTimer = setTimeout(() => {
        headlineWrapper.classList.add('anim-soft-recess');
        bottomActionGroup.classList.add('anim-soft-recess');
      }, READING_TIME_PAUSE);

      // Phase 3: Center Badge Pop Reveal
      revealTimer = setTimeout(() => {
        centerLogo.classList.add('anim-badge-reveal');
      }, READING_TIME_PAUSE + BADGE_REVEAL_DELAY);
    }

    window.onload = function() {
      runLaunchSequence();
    };
  </script>
</body>
</html>
